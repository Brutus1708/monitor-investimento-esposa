name: Monitor de Investimentos

on:
  schedule:
    # Pregão: a cada 30 min, seg-sex, das 9h às 18h (Brasília = UTC-3)
    - cron: "*/30 12-21 * * 1-5"
    # Fora do pregão: de hora em hora (cripto, câmbio e notícias não param)
    - cron: "0 0-11,22,23 * * 1-5"
    - cron: "0 * * * 0,6"
  push:
    branches: [main]
  workflow_dispatch: {}

# O site é publicado direto pelo GitHub Actions: nada é gravado no repositório a cada rodada
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitorar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Rodar monitor
        run: python monitor.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PAGES_URL: ${{ vars.PAGES_URL }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Publicar site
        id: publicar
        uses: actions/deploy-pages@v4
