name: Monitor de Investimentos

on:
  schedule:
    # O agendador do GitHub é "melhor esforço": atrasa ou pula execuções, principalmente no minuto 00.
    # Por isso pedimos a cada 15 min em minutos quebrados; na prática chega perto de 30 min a 1 h.
    - cron: "7,22,37,52 * * * *"
  push:
    branches: [main]
  workflow_dispatch: {}

# O site é publicado direto pelo GitHub Actions: nada é gravado no repositório a cada rodada
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitorar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Rodar monitor
        run: python monitor.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PAGES_URL: ${{ vars.PAGES_URL }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Publicar site
        id: publicar
        uses: actions/deploy-pages@v4
